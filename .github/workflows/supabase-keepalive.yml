# Free-tier Supabase projects pause after ~7 days without activity.
# This hits a public, RLS-readable table twice a week so the project stays awake.
# Required repo secrets: SUPABASE_URL, SUPABASE_ANON_KEY (anon key only, never the service role key).
name: Supabase keep-alive

on:
  schedule:
    - cron: '0 3 * * 1,4' # Monday & Thursday 03:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query categories
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -fsS --retry 3 --retry-delay 10 \
            "$SUPABASE_URL/rest/v1/categories?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
